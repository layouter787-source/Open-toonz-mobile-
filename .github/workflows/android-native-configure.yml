name: Android Tablet APK (OpenToonz ARM64)

on:
  push:
    branches: [master, main, 'mobile/**']
    paths:
      - 'toonz/sources/**'
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/CMakeLists.txt'
      - 'toonz/sources/cmake/AndroidLegacyGL.cmake'
      - 'ci/android/fetch-opencv-android-sdk.sh'
      - 'ci/android/fetch-boost-headers.sh'
      - '.github/workflows/android-native-configure.yml'
  pull_request:
    paths:
      - 'toonz/sources/**'
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/CMakeLists.txt'
      - 'toonz/sources/cmake/AndroidLegacyGL.cmake'
      - 'ci/android/fetch-opencv-android-sdk.sh'
      - 'ci/android/fetch-boost-headers.sh'
      - '.github/workflows/android-native-configure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-original-native-target:
    name: Configure original OpenToonz target for Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools ndk;21.3.6528147 cmake;3.22.1 platforms;android-35'

      - name: Install Qt 5.15.2 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: linux
          target: android
          arch: android
          modules: 'qtscript'
          archives: 'qtbase qtmultimedia qtsvg qttools qtandroidextras'
          cache: true

      - name: Fetch checksum-verified OpenCV Android SDK
        shell: bash
        run: ci/android/fetch-opencv-android-sdk.sh "$GITHUB_WORKSPACE/thirdparty/opencv-android-sdk"

      - name: Fetch checksum-verified Boost headers
        shell: bash
        run: bash ci/android/fetch-boost-headers.sh "$GITHUB_WORKSPACE/thirdparty/boost-android-headers"

      - name: Configure the original C++/Qt application (experimental)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.3.6528147"
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt5/Qt5Config.cmake"
          QT5CORE_CONFIG="$(find "$QT_ROOT_DIR/lib/cmake" -name Qt5CoreConfig.cmake -print -quit)"
          test -n "$QT5CORE_CONFIG"
          QT5CORE_DIR="$(dirname "$QT5CORE_CONFIG")"
          cmake -S toonz/sources -B build/android-opentoonz-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt5_DIR="$QT_ROOT_DIR/lib/cmake/Qt5" \
            -DQt5Core_DIR="$QT5CORE_DIR" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DOPEN_TOONZ_ANDROID_OPENCV_ROOT="$GITHUB_WORKSPACE/thirdparty/opencv-android-sdk" \
            -DBOOST_ROOT="$GITHUB_WORKSPACE/thirdparty/boost-android-headers" \
            -DBoost_INCLUDE_DIR="$GITHUB_WORKSPACE/thirdparty/boost-android-headers" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD \
            -DOPEN_TOONZ_ANDROID_EXPERIMENTAL_NATIVE_BUILD=ON

      - name: Compile the original OpenToonz editor for Android ARM64 (experimental)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/android-opentoonz-arm64 --target OpenToonz --parallel 2 2>&1 | tee build/android-opentoonz-arm64/android-build.log

      - name: Install Java 11 for Qt 5.15 Android packaging
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Package installable tablet APK with androiddeployqt
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/android-opentoonz-arm64"
          QT_ANDROIDDEPLOYQT="$(find "$QT_ROOT_DIR" -type f -name androiddeployqt -perm -111 -print -quit)"
          test -n "$QT_ANDROIDDEPLOYQT" && test -x "$QT_ANDROIDDEPLOYQT"
          DEPLOY_SETTINGS="$(find "$BUILD_DIR" -type f -name '*deployment-settings.json' -print -quit)"
          if [ -z "$DEPLOY_SETTINGS" ]; then
            echo "Qt deployment settings JSON was not generated. Cannot package an APK."
            find "$BUILD_DIR" -maxdepth 5 -type f -name '*.json' -print | head -n 80
            exit 1
          fi
          ANDROID_OUT="$BUILD_DIR/android-build"
          mkdir -p "$ANDROID_OUT"
          echo "Using androiddeployqt: $QT_ANDROIDDEPLOYQT"
          echo "Using deployment settings: $DEPLOY_SETTINGS"
          "$QT_ANDROIDDEPLOYQT" --input "$DEPLOY_SETTINGS" --output "$ANDROID_OUT" --android-platform android-35 --jdk "$JAVA_HOME" --gradle
          APK="$(find "$ANDROID_OUT" -type f -name '*.apk' -print | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "androiddeployqt finished but no APK was found."
            find "$ANDROID_OUT" -maxdepth 8 -type f | head -n 200
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ToonzTab-tablet-arm64-debug.apk"
          test -s "$GITHUB_WORKSPACE/dist/ToonzTab-tablet-arm64-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/dist/ToonzTab-tablet-arm64-debug.apk"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$GITHUB_WORKSPACE/dist/ToonzTab-tablet-arm64-debug.apk" | tee "$GITHUB_WORKSPACE/dist/apk-badging.txt"
          fi
          sha256sum "$GITHUB_WORKSPACE/dist/ToonzTab-tablet-arm64-debug.apk" | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - name: Upload installable tablet APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ToonzTab-tablet-arm64-debug-apk
          path: |
            dist/ToonzTab-tablet-arm64-debug.apk
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Extract concise native build diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/android-opentoonz-arm64
          LOG=build/android-opentoonz-arm64/android-build.log
          REPORT=build/android-opentoonz-arm64/android-build-diagnostics.txt
          {
            echo "ToonzTab Android ARM64 native build diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f "$LOG" ]; then
              echo "=== First compiler/linker/configuration errors (up to 160 lines) ==="
              grep -nE 'error:|fatal error:|undefined reference|clang\+\+: error|CMake Error|FAILED:|ninja: build stopped|gmake\[[0-9]+\]: \*\*\*' "$LOG" | head -n 160
              echo
              echo "=== Failure summary ==="
              grep -E 'clang\+\+: error: linker command failed|No rule to make target|CMake Generate step failed|CMake Error|Error [0-9]+|gmake\[[0-9]+\]: \*\*\*' "$LOG" | tail -n 40
            else
              echo "No android-build.log was produced. Check the configure step and CMake logs."
            fi
          } > "$REPORT"
          cat "$REPORT"
          exit 0

      - name: Save Android native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-build-logs
          path: |
            build/android-opentoonz-arm64/android-build.log
            build/android-opentoonz-arm64/android-build-diagnostics.txt
            build/android-opentoonz-arm64/CMakeFiles/CMakeOutput.log
            build/android-opentoonz-arm64/CMakeFiles/CMakeError.log
            build/android-opentoonz-arm64/android-build.log
            build/android-opentoonz-arm64/android-build/**/*.log
            build/android-opentoonz-arm64/android-build/**/*.txt
            build/android-opentoonz-arm64/android-build/**/*deployment-settings.json
          if-no-files-found: ignore

      - name: Save CMake configure log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-configure-log
          path: build/android-opentoonz-arm64/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
