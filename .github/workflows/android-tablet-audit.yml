name: Android Tablet Port Audit

on:
  push:
    branches: [master, main, 'mobile/**']
    paths:
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/**'
      - 'toonz/sources/toonz/toolbar.cpp'
      - 'toonz/sources/common/tapptools/tenv.cpp'
      - 'toonz/sources/common/tgl/tgl.cpp'
      - 'toonz/sources/include/tgl.h'
      - 'toonz/sources/common/tvrender/tofflinegl.cpp'
      - 'toonz/sources/common/tvrender/qtofflinegl.cpp'
      - 'toonz/sources/include/qtofflinegl.h'
      - 'toonz/sources/stdfx/shadingcontext.cpp'
      - 'toonz/sources/image/CMakeLists.txt'
      - 'toonz/sources/image/tiio.cpp'
      - 'toonz/sources/stopmotion/**'
      - 'ci/android/**'
      - 'doc/android_tablet_port_audit.md'
      - 'doc/android_tablet_dependency_matrix.md'
      - 'doc/tablet_port_roadmap.md'
      - '.github/workflows/android-tablet-audit.yml'
  pull_request:
    paths:
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/**'
      - 'toonz/sources/toonz/toolbar.cpp'
      - 'toonz/sources/common/tapptools/tenv.cpp'
      - 'toonz/sources/common/tgl/tgl.cpp'
      - 'toonz/sources/include/tgl.h'
      - 'toonz/sources/common/tvrender/tofflinegl.cpp'
      - 'toonz/sources/common/tvrender/qtofflinegl.cpp'
      - 'toonz/sources/include/qtofflinegl.h'
      - 'toonz/sources/stdfx/shadingcontext.cpp'
      - 'toonz/sources/image/CMakeLists.txt'
      - 'toonz/sources/image/tiio.cpp'
      - 'toonz/sources/stopmotion/**'
      - 'ci/android/**'
      - 'doc/android_tablet_port_audit.md'
      - 'doc/android_tablet_dependency_matrix.md'
      - 'doc/tablet_port_roadmap.md'
      - '.github/workflows/android-tablet-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Check native Android port assumptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate native ToonzTab port assumptions
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/android/fetch-opencv-android-sdk.sh

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = [
              "toonz/sources/CMakeLists.txt",
              "toonz/sources/toonz/CMakeLists.txt",
              "toonz/sources/toonz/main.cpp",
              "toonz/sources/common/tapptools/tenv.cpp",
              "toonz/sources/common/tgl/tgl.cpp",
              "toonz/sources/include/tgl.h",
              "toonz/sources/toonzlib/toonzfolders.cpp",
              "toonz/sources/toonz/mainwindow.cpp",
              "toonz/sources/common/tvrender/tofflinegl.cpp",
              "toonz/sources/common/tvrender/qtofflinegl.cpp",
              "toonz/sources/include/qtofflinegl.h",
              "toonz/sources/stdfx/shadingcontext.cpp",
              "toonz/sources/toonz/android/AndroidManifest.xml",
              "doc/android_tablet_port_audit.md",
              "doc/android_tablet_dependency_matrix.md",
              "doc/tablet_port_roadmap.md",
              "ci/android/fetch-opencv-android-sdk.sh",
          ]
          for name in required:
              assert Path(name).is_file(), f"Missing required port file: {name}"

          top = Path("toonz/sources/CMakeLists.txt").read_text()
          app_cmake = Path("toonz/sources/toonz/CMakeLists.txt").read_text()
          main = Path("toonz/sources/toonz/main.cpp").read_text()
          tenv = Path("toonz/sources/common/tapptools/tenv.cpp").read_text()
          folders = Path("toonz/sources/toonzlib/toonzfolders.cpp").read_text()
          window = Path("toonz/sources/toonz/mainwindow.cpp").read_text()
          offline_h = Path("toonz/sources/include/qtofflinegl.h").read_text()
          offline_cpp = Path("toonz/sources/common/tvrender/qtofflinegl.cpp").read_text()
          offlineselect = Path("toonz/sources/common/tvrender/tofflinegl.cpp").read_text()
          shading = Path("toonz/sources/stdfx/shadingcontext.cpp").read_text()
          toolbar = Path("toonz/sources/toonz/toolbar.cpp").read_text()
          tgl_cpp = Path("toonz/sources/common/tgl/tgl.cpp").read_text()
          tgl_h = Path("toonz/sources/include/tgl.h").read_text()
          matrix = Path("doc/android_tablet_dependency_matrix.md").read_text()
          audit = Path("doc/android_tablet_port_audit.md").read_text()
          roadmap = Path("doc/tablet_port_roadmap.md").read_text()

          # Platform discovery must distinguish Android from generic desktop Unix.
          assert "if(ANDROID)" in top
          assert "set(BUILD_TARGET_ANDROID ON)" in top
          assert "set(BUILD_ENV_ANDROID ON)" in top

          # Keep the fail-fast guard until the complete dependency/link path is ready.
          anchor = top.find("# The full OpenToonz app still requests desktop-only Qt modules")
          guard = top.find("if(BUILD_ENV_ANDROID)", anchor)
          guard_end = top.find("endif()", guard)
          qt_discovery = top.find("find_package(Qt5 REQUIRED")
          opencv_discovery = top.find("find_package(OpenCV")
          guard_message = top.find(
              "Android NDK detected, but the full OpenToonz Android tablet target is not ready"
          )
          assert anchor >= 0 and guard > anchor and guard_end > guard
          assert guard < guard_message < guard_end
          assert guard_end < qt_discovery and guard_end < opencv_discovery
          print("PASS: Android is explicit and native configuration fails safely before unsupported dependencies.")

          # The original OpenToonz executable target remains the Android target.
          assert "elseif(BUILD_TARGET_ANDROID)" in app_cmake
          assert "add_executable(OpenToonz" in app_cmake
          assert "ANDROID_PACKAGE_SOURCE_DIR" in app_cmake
          assert "Qt5::AndroidExtras" in app_cmake
          assert 'set(ANDROID_PACKAGE_SOURCE_DIR "${CMAKE_CURRENT_BINARY_DIR}/android-package")' in app_cmake
          assert 'file(COPY "${CMAKE_CURRENT_SOURCE_DIR}/android/"' in app_cmake
          assert 'file(COPY "${OPEN_TOONZ_STUFF_SOURCE_DIR}/"' in app_cmake
          assert "OPEN_TOONZ_STUFF_ASSETS" in app_cmake
          assert "stuff-manifest.txt" in app_cmake
          print("PASS: Android packaging targets the original C++/Qt application and stages its asset tree.")

          # Ensure only the Android startup path requests GLES and skips desktop GLUT.
          graphics = main.find("Initializing graphics...")
          android = main.find("#ifdef Q_OS_ANDROID", graphics)
          desktop = main.find("#else", android)
          gles = main.find("QSurfaceFormat::OpenGLES", android)
          glut = main.find("glutInit(&argc, argv);", graphics)
          assert graphics >= 0 and android > graphics and desktop > android
          assert android < gles < desktop
          assert glut > desktop
          assert 'QCoreApplication::setApplicationName("ToonzTab")' in main
          assert 'applicationFullName = QStringLiteral("ToonzTab")' in window
          qgl_include = window.find("#include <QGLPixelBuffer>")
          qgl_guard = window.rfind("#ifndef Q_OS_ANDROID", 0, qgl_include)
          qgl_guard_end = window.find("#endif", qgl_include)
          assert qgl_include >= 0 and qgl_guard >= 0 and qgl_guard_end > qgl_include
          assert "Keep this desktop-only feature unavailable until it has a GLES renderer." in window
          assert "#ifdef Q_OS_ANDROID" in window
          assert 'std::make_shared<QtOfflineGL>(dim, shared)' in offlineselect
          assert 'QGLPixelBuffer' in offline_h and 'glBegin(GL_QUAD_STRIP)' in offlineselect
          assert '#ifndef Q_OS_ANDROID' in offline_h
          assert 'format.setRenderableType(QSurfaceFormat::OpenGLES)' in offline_cpp
          assert 'format.setVersion(2, 0)' in offline_cpp
          assert 'defined(Q_OS_ANDROID)' in offlineselect
          assert '#include <GL/glew.h>' in shading
          assert "tglInitializeAndroidGLCompat" in tgl_h
          assert "set_getprocaddress(toonzGL4ESGetProcAddress)" in tgl_cpp
          assert "set_getmainfbsize" in tgl_cpp and "initialize_gl4es()" in tgl_cpp
          assert "eglGetCurrentDisplay()" in tgl_cpp and "eglGetCurrentSurface(EGL_DRAW)" in tgl_cpp
          for path in ("toonz/sources/toonz/sceneviewer.cpp", "toonz/sources/toonz/imageviewer.cpp",
                       "toonz/sources/toonzqt/planeviewer.cpp", "toonz/sources/toonzqt/styleeditor.cpp",
                       "toonz/sources/toonz/preferencespopup.cpp"):
              assert "tglInitializeAndroidGLCompat();" in Path(path).read_text(), path
          assert 'glBegin(GL_QUADS)' in shading
          assert 'QGLPixelBuffer' in offline_cpp
          assert '#ifdef Q_OS_ANDROID' in toolbar
          assert 'setIconSize(QSize(28, 28))' in toolbar
          assert 'setMinimumSize(48, 48)' in toolbar
          assert "QStandardPaths::writableLocation(QStandardPaths::AppDataLocation)" in tenv
          assert "QStandardPaths::AppConfigLocation" in tenv
          assert "systemVarDirectory" in tenv
          assert 'assets:/stuff-manifest.txt' in tenv
          assert 'assets:/stuff/' in tenv
          assert "copyAndroidStuffAssets" in tenv
          assert "TEnv::getStuffDir() + TEnv::getSystemPathMap().at(\"PROJECTS\")" in folders
          assert "app-private storage" in folders
          print("PASS: Android startup, private runtime data/config and project storage are selected independently of desktop paths.")

          # Validate the actual Qt Android deployment template.
          manifest_path = "toonz/sources/toonz/android/AndroidManifest.xml"
          root = ET.parse(manifest_path).getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          assert root.attrib.get("package") == "com.toonz.tab"
          app = root.find("application")
          assert app is not None and app.attrib.get(android_ns + "label") == "ToonzTab"
          activity = app.find("activity")
          assert activity is not None
          assert activity.attrib.get(android_ns + "screenOrientation") == "landscape"
          assert activity.attrib.get(android_ns + "exported") == "true"
          assert "%%INSERT_APP_LIB_NAME%%" in Path(manifest_path).read_text()
          print("PASS: ToonzTab manifest is well-formed, landscape-configured, and preserves Qt deployment placeholders.")

          # Documents must say what remains blocked instead of claiming an APK.
          assert "Main application graphics startup" in matrix
          assert "has not been compiled or tested" in matrix
          assert "not finished" in roadmap
          assert "do **not** mean that OpenToonz builds or runs on Android yet" in audit
          assert not Path("mobile-android/app/src/main/java/org/opentoonz/mobile/MainActivity.kt").exists()
          assert not Path(".github/workflows/android-mobile.yml").exists()
          print("PASS: Audit records the remaining native blockers; the standalone Kotlin replacement and its APK workflow are absent.")
          print("SOURCE AUDIT PASSED. This does not build or certify an Android APK.")
          PY
