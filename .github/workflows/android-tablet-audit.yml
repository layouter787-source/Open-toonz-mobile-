name: Android Tablet Port Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
    paths:
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/main.cpp'
      - 'toonz/sources/toonz/CMakeLists.txt'
      - 'toonz/sources/toonz/android/AndroidManifest.xml'
      - 'toonz/sources/stopmotion/stopmotionserial.cpp'
      - 'toonz/sources/stopmotion/stopmotion.cpp'
      - 'toonz/sources/image/CMakeLists.txt'
      - 'toonz/sources/image/tiio.cpp'
      - 'doc/android_tablet_port_audit.md'
      - 'doc/android_tablet_dependency_matrix.md'
      - '.github/workflows/android-tablet-audit.yml'
  pull_request:
    paths:
      - 'toonz/sources/CMakeLists.txt'
      - 'toonz/sources/toonz/main.cpp'
      - 'toonz/sources/toonz/CMakeLists.txt'
      - 'toonz/sources/toonz/android/AndroidManifest.xml'
      - 'toonz/sources/stopmotion/stopmotionserial.cpp'
      - 'toonz/sources/stopmotion/stopmotion.cpp'
      - 'toonz/sources/image/CMakeLists.txt'
      - 'toonz/sources/image/tiio.cpp'
      - 'doc/android_tablet_port_audit.md'
      - 'doc/android_tablet_dependency_matrix.md'
      - '.github/workflows/android-tablet-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Check Android port assumptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source files and report known blockers
        shell: bash
        run: |
          set -euo pipefail
          test -f toonz/sources/CMakeLists.txt
          test -f toonz/sources/toonz/main.cpp
          echo '--- CMake platform branches ---'
          grep -nE 'BUILD_TARGET_ANDROID|BUILD_TARGET_WIN|BUILD_TARGET_APPLE|BUILD_TARGET_UNIX|CMAKE_SYSTEM_NAME' toonz/sources/CMakeLists.txt | head -n 35 || true
          echo '--- Dedicated Android target detection and fail-fast guard ---'
          grep -nE 'BUILD_ENV_ANDROID|Android NDK detected|Target system is ANDROID' toonz/sources/CMakeLists.txt
          grep -q 'if(ANDROID)' toonz/sources/CMakeLists.txt
          grep -q 'set(BUILD_TARGET_ANDROID ON)' toonz/sources/CMakeLists.txt
          awk 'index($0, "if(ANDROID)") { android=1 } index($0, "set(BUILD_TARGET_UNIX ON)") && android { posix=1 } index($0, "elseif(WIN32)") { android=0 } END { exit !posix }' toonz/sources/CMakeLists.txt
          grep -q 'set(BUILD_ENV_ANDROID ON)' toonz/sources/CMakeLists.txt
          grep -q 'Android NDK detected' toonz/sources/CMakeLists.txt
          grep -q 'if(NOT BUILD_TARGET_ANDROID)' toonz/sources/CMakeLists.txt
          grep -q 'add_subdirectory(tcleanupper EXCLUDE_FROM_ALL)' toonz/sources/CMakeLists.txt
          grep -q 'add_subdirectory(tcomposer EXCLUDE_FROM_ALL)' toonz/sources/CMakeLists.txt
          grep -q 'add_subdirectory(tconverter EXCLUDE_FROM_ALL)' toonz/sources/CMakeLists.txt
          grep -q 'add_subdirectory(toonzfarm EXCLUDE_FROM_ALL)' toonz/sources/CMakeLists.txt
          grep -q 'if(LZODRIVER_FOUND AND NOT BUILD_TARGET_ANDROID)' toonz/sources/toonz/CMakeLists.txt
          awk '/if\(NOT BUILD_TARGET_ANDROID\)/ { inside=1 } /list\(APPEND OPEN_TOONZ_QT_MODULES/ && inside { list=1 } /PrintSupport/ && list { found=1 } /endif\(\)/ && inside { inside=0 } END { exit !found }' toonz/sources/CMakeLists.txt
          awk '/if\(NOT BUILD_TARGET_ANDROID\)/ { inside=1 } /list\(APPEND SOURCES print.cpp\)/ && inside { found=1 } /endif\(\)/ && inside { inside=0 } END { exit !found }' toonz/sources/toonz/CMakeLists.txt
          grep -q 'QPdfWriter' toonz/sources/toonz/exportxsheetpdf.cpp
          grep -q 'set(OPEN_TOONZ_QT_MODULES' toonz/sources/CMakeLists.txt
          awk 'index($0, "if(NOT BUILD_TARGET_ANDROID)") { inside=1 } index($0, "list(APPEND OPEN_TOONZ_QT_MODULES") && inside { in_list=1 } index($0, "MultimediaWidgets") && in_list { multimedia_widgets=1 } index($0, "SerialPort") && in_list { serial_port=1 } index($0, "endif()") && inside { inside=0 } END { exit !(multimedia_widgets && serial_port) }' toonz/sources/CMakeLists.txt
          grep -q '#ifdef Q_OS_ANDROID' toonz/sources/stopmotion/stopmotionserial.cpp
          grep -q 'QStringList StopMotionSerial::getAvailableSerialPorts' toonz/sources/stopmotion/stopmotionserial.cpp
          grep -q 'OPEN_TOONZ_ANDROID_OPENCV_ROOT' toonz/sources/CMakeLists.txt
          grep -q 'OPENCV_ANDROID_SDK_ROOT' toonz/sources/CMakeLists.txt
          grep -q 'cameracapturelevelcontrol_qt.cpp' toonz/sources/toonz/CMakeLists.txt
          grep -q 'penciltestpopup_qt.cpp' toonz/sources/toonz/CMakeLists.txt
          grep -q 'penciltestpopup_qt.h' toonz/sources/toonz/CMakeLists.txt
          grep -q '#ifdef Q_OS_ANDROID' toonz/sources/stopmotion/stopmotion.cpp
          awk 'index($0, "elseif(BUILD_TARGET_ANDROID)") { android=1 } index($0, "elseif(BUILD_TARGET_UNIX)") { if (android) unixbranch=1; android=0 } index($0, "mov/tiio_mov_proxy.cpp") && android { proxy=1 } END { exit !(unixbranch && !proxy) }' toonz/sources/image/CMakeLists.txt
          awk '/if\(NOT BUILD_TARGET_ANDROID\)/ { inside=1 } /list\(APPEND SOURCES/ && inside { in_sources=1 } /mov\/tiio_mov_proxy.cpp/ && in_sources { mov=1 } /3gp\/tiio_3gp_proxy.cpp/ && in_sources { gp=1 } /endif\(\)/ && inside { inside=0; in_sources=0 } END { exit !(mov && gp) }' toonz/sources/image/CMakeLists.txt
          awk '/#ifndef Q_OS_ANDROID/ { guarded=1 } /if \(IsQuickTimeInstalled\(\)\)/ && guarded { found=1 } /#endif/ && guarded { guarded=0 } END { exit !found }' toonz/sources/image/tiio.cpp
          grep -q 'if (ThirdParty::checkFFmpeg())' toonz/sources/image/tiio.cpp
          awk '/kis_tablet_support_win8.h/ { if (previous ~ /#ifdef _WIN32/) found=1 } { previous=$0 } END { exit !found }' toonz/sources/toonz/main.cpp
          awk '/#ifndef Q_OS_ANDROID/ { guarded=1 } /QGLPixelBuffer/ && guarded { found=1 } /#endif/ && guarded { guarded=0 } END { exit !found }' toonz/sources/toonz/main.cpp
          grep -q 'Android tablets use the full landscape activity' toonz/sources/toonz/main.cpp
          grep -q '#if !defined(MACOSX) && !defined(Q_OS_ANDROID)' toonz/sources/toonz/main.cpp
          echo 'Windows-only tablet support include is correctly guarded.'
          grep -q 'if(BUILD_TARGET_WIN)' toonz/sources/toonz/CMakeLists.txt
          awk 'index($0, "if(BUILD_TARGET_WIN)") { inside=1 } index($0, "list(APPEND HEADERS kis_tablet_support_win8.h)") && inside { header=1 } index($0, "list(APPEND SOURCES kis_tablet_support_win8.cpp)") && inside { source=1 } index($0, "endif()") && inside { inside=0 } END { exit !(header && source) }' toonz/sources/toonz/CMakeLists.txt
          echo 'Windows-only tablet implementation is selected only for Windows.'
          echo '--- Qt modules currently required ---'
          grep -nA18 'find_package(Qt5 REQUIRED' toonz/sources/CMakeLists.txt || true
          echo '--- Desktop/tablet-specific include in main.cpp ---'
          grep -nE 'kis_tablet_support_win8|QGLPixelBuffer|QWindowsWindowFunctions' toonz/sources/toonz/main.cpp || true
          echo '--- Android dependency blocker matrix ---'
          test -f doc/android_tablet_dependency_matrix.md
          test -f toonz/sources/toonz/android/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' toonz/sources/toonz/android/AndroidManifest.xml
          grep -q 'android:smallScreens="false"' toonz/sources/toonz/android/AndroidManifest.xml
          grep -q 'android:name="android.app.lib_name"' toonz/sources/toonz/android/AndroidManifest.xml
          grep -q '%%INSERT_APP_LIB_NAME%%' toonz/sources/toonz/android/AndroidManifest.xml
          grep -q 'ANDROID_PACKAGE_SOURCE_DIR' toonz/sources/toonz/CMakeLists.txt
          grep -q 'elseif(BUILD_TARGET_ANDROID)' toonz/sources/toonz/CMakeLists.txt
          grep -q 'LayFrame Studio' toonz/sources/toonz/android/AndroidManifest.xml
          grep -q 'package="io.github.layframe.studio"' toonz/sources/toonz/android/AndroidManifest.xml
          echo 'Qt Android packaging template is tablet/landscape configured and retains androiddeployqt placeholders.'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "toonz/sources/toonz/android/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          assert root.attrib["package"] == "io.github.layframe.studio"
          application = root.find("application")
          assert application is not None
          activity = application.find("activity")
          assert activity is not None
          assert activity.attrib[android + "screenOrientation"] == "landscape"
          assert activity.attrib[android + "exported"] == "true"
          print("AndroidManifest.xml is well-formed and the tablet package settings are present.")
          PY
          echo '--- Android fail-fast guard placement ---'
          python3 - <<'PY'
          from pathlib import Path
          source = Path("toonz/sources/CMakeLists.txt").read_text()
          anchor = source.find("# The full OpenToonz app still requests desktop-only Qt modules")
          guard = source.find("if(BUILD_ENV_ANDROID)", anchor)
          guard_end = source.find("endif()", guard)
          qt = source.find("find_package(Qt5 REQUIRED")
          opencv = source.find("find_package(OpenCV")
          message = source.find("Android NDK detected, but the full OpenToonz Android tablet target is not ready")
          assert guard >= 0 and guard_end > guard, "Android guard is missing or malformed"
          assert message > guard and message < guard_end, "guard message is outside the Android guard"
          assert qt > guard_end, "Qt dependency discovery runs before the Android guard"
          assert opencv > guard_end, "OpenCV discovery runs before the Android guard"
          print("The Android guard is present before desktop Qt/OpenCV dependency discovery.")
          PY
          grep -q 'does not support the Qt Serial Port module' doc/android_tablet_dependency_matrix.md
          grep -q 'Multimedia Widgets is not supported on Android' doc/android_tablet_dependency_matrix.md
          grep -q 'Android graphics and native-library link branches' doc/android_tablet_dependency_matrix.md
          echo 'Known unsupported Qt modules and Android link blockers are documented.'
          echo '--- Audit document ---'
          test -f doc/android_tablet_port_audit.md
          echo 'Audit checks passed. This is a source audit only; it does not build an Android APK.'
