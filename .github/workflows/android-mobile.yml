name: Android mobile foundation

on:
  push:
    branches: [ "master", "main", "mobile/**" ]
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-mobile.yml"
  pull_request:
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-mobile.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        working-directory: mobile-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opentoonz-mobile-debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
