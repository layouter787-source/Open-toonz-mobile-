name: Android Native Graphics Compatibility

on:
  push:
    branches: [master, main, 'mobile/**']
    paths:
      - 'toonz/sources/cmake/AndroidLegacyGL.cmake'
      - 'ci/android/graphics-probe/**'
      - 'toonz/sources/common/tgl/tgl.cpp'
      - 'toonz/sources/include/tgl.h'
      - '.github/workflows/android-native-graphics.yml'
  pull_request:
    paths:
      - 'toonz/sources/cmake/AndroidLegacyGL.cmake'
      - 'ci/android/graphics-probe/**'
      - 'toonz/sources/common/tgl/tgl.cpp'
      - 'toonz/sources/include/tgl.h'
      - '.github/workflows/android-native-graphics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-graphics-cross-link:
    name: Cross-build legacy GL compatibility for ARM64 Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools ndk;27.2.12479018 cmake;3.31.6 platforms;android-35'

      - name: Configure compatibility libraries with the NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          cmake -S ci/android/graphics-probe -B build/android-graphics-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and link OpenGL/GLU compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/android-graphics-arm64 --target toonz_android_gl_probe --parallel 2
          find build/android-graphics-arm64 -type f \( -name 'libGL.a' -o -name 'libToonzAndroidGLU.a' -o -name 'toonz_android_gl_probe' \) -print
          test -n "$(find build/android-graphics-arm64 -name 'libGL.a' -print -quit)"
          test -n "$(find build/android-graphics-arm64 -name 'libToonzAndroidGLU.a' -print -quit)"
          test -n "$(find build/android-graphics-arm64 -name 'toonz_android_gl_probe' -print -quit)"

      - name: Upload cross-linked compatibility libraries (not an app APK)
        uses: actions/upload-artifact@v4
        with:
          name: toonz-tab-arm64-gl-compatibility-probe
          path: |
            build/android-graphics-arm64/lib/opentoonz/libGL.a
            build/android-graphics-arm64/lib/opentoonz/libToonzAndroidGLU.a
          if-no-files-found: warn
